[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-calc"
version = "1.0.0"
description = "Librería de cálculos geográficos: distancias, rumbos, coordenadas y áreas"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "celys" }]
keywords = ["geographics", "geodesy", "distance", "coordinates", "UTM", "haversine", "vincenty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["geo_calc*"]
